[package]
name = "cgol-bestiary"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/lunaticwithaduck/cgol-bestiary"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# HashLife backend for the macrocell patterns. Vendored rather than taken from
# crates.io because the integration needs the quadtree itself, which upstream
# keeps private — see vendor/golback/VENDORED.md.
#
# gol_engines implements the better algorithm (StreamLife) but cannot be used
# here: tokio's rt-multi-thread is a mandatory dependency and is unsupported on
# wasm32-unknown-unknown.
golback = { path = "vendor/golback" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Used only by build.sh. `panic = "abort"` cannot live in the release profile:
# cargo ignores it for the test harness itself but not for the library it links
# against, so `cargo test --release` fails on the strategy mismatch.
[profile.wasm]
inherits = "release"
panic = "abort"
strip = true
